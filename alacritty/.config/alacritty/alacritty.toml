[general]
import = ["~/.config/alacritty/themes/themes/base16-gruvbox-material-dark-soft-256.toml"]

[font]
size = 25

[env]
term = "xterm-256color"

[font.normal]
family = "UbuntuMono Nerd Font Mono"
style = "Regular"

[window]
decorations = "Full"
startup_mode = "Windowed"
option_as_alt = "OnlyLeft"

[window.padding]
x = 5
y = 5
